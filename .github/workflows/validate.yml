name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package structure
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/humanizer-ja-pycache
        run: python scripts/validate_package.py .

      - name: Run unit tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/humanizer-ja-pycache
        run: python -m unittest discover -s tests -v

      - name: Verify package checksums
        run: sha256sum -c CHECKSUMS.sha256

      - name: Verify source-only tracked surface
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.codex|__pycache__)(/|$)|\.pyc$|\.zip$|\.tar(\.gz)?$'; then
            echo "Forbidden generated or local-state path is tracked."
            exit 1
          fi
